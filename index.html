<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LL Office Manager"><meta name="theme-color" content="#fde2ec">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>LL Office Manager</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b1b1b}
body{background:#fff url('bg.webp') center top/900px auto repeat;min-height:100vh}
.top{background:#fde2ec;color:#5b0f2e;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:3px solid #f9a8c9}
.top img{width:46px;height:46px;border-radius:9px;background:#fff}.top b{font-size:21px}.top span{display:block;font-size:13px;color:#9d174d;font-weight:700}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px}
.go{display:block;width:100%;text-align:center;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-weight:900;font-size:20px;border-radius:16px;padding:22px 12px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.note{background:rgba(255,255,255,.95);border-radius:12px;padding:12px 14px;font-size:14px;color:#374151;line-height:1.5;margin-top:16px}
</style></head><body>
<div class="top"><img src="icon-192.png" alt=""><div><b>LL Office Manager</b><span>Latoison Law</span></div></div>
<div class="wrap">
<a class="go" id="go" href="#">OPEN LL OFFICE MANAGER</a>
<div class="note">Payments, Calendar, Court Reminders and New Potentials. Sign in with your office PIN.</div>
</div>
<script>
const OFFICE='https://script.google.com/a/macros/latoisonlaw.com/s/AKfycbykyjHO-Z5B9KknvJraVK7fA1di4u0DOtP3qLqaZhKDh-dCKna2-pk7sX7T6H0Dl15q/exec';
document.getElementById('go').href=OFFICE+'?app=phone';
</script>
</body></html>
