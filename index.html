<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LL Office Manager"><meta name="theme-color" content="#fde2ec">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>LL Office Manager</title>
<style>
/* 10/20: the Office Manager opens INSIDE this app (it used to jump to script.google.com, which made the phone show
   its "tap to copy the URL" bar at the top because the app was leaving its own site) */
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fde2ec;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{position:fixed;top:env(safe-area-inset-top);left:0;right:0;bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#fff}
#wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#5b0f2e;font-weight:800;font-size:18px;background:#fde2ec}
#wait img{width:84px;height:84px;border-radius:16px;background:#fff}
#wait a{font-size:14px;color:#9d174d;font-weight:700}
</style></head><body>
<div id="wait"><img src="icon-192.png" alt=""><div>Opening LL Office Manager…</div><a id="alt" href="#" style="display:none">Taking too long? Tap here.</a></div>
<iframe id="app" title="LL Office Manager" allow="clipboard-write; camera; microphone"></iframe>
<script>
const OFFICE='https://script.google.com/a/macros/latoisonlaw.com/s/AKfycbykyjHO-Z5B9KknvJraVK7fA1di4u0DOtP3qLqaZhKDh-dCKna2-pk7sX7T6H0Dl15q/exec?app=phone';
const f=document.getElementById('app'),w=document.getElementById('wait'),alt=document.getElementById('alt');
alt.href=OFFICE;f.addEventListener('load',()=>{w.style.display='none'});f.src=OFFICE;
setTimeout(()=>{alt.style.display='block'},12000);
</script>
</body></html>
